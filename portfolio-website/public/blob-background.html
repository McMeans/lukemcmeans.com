<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ambient background</title>
  <style>
    :root {
      --page-bg: #070c14;
      --ease-glass: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--page-bg);
    }

    .ambient-root {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background: var(--page-bg);
      contain: layout paint;
      isolation: isolate;
    }

    .ambient-parallax {
      position: absolute;
      inset: -10%;
      transform: translate3d(0, 0, 0);
    }

    .ambient-blob {
      position: absolute;
      top: var(--y);
      left: var(--x);
      width: var(--sz);
      height: var(--sz);
      transform: translate3d(-50%, -50%, 0);
      background-color: var(--c);
      -webkit-mask: radial-gradient(circle at 50% 50%, #000 0%, transparent 62%);
      mask: radial-gradient(circle at 50% 50%, #000 0%, transparent 62%);
      filter: blur(var(--bl));
      opacity: var(--op);
      border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
      mix-blend-mode: lighten;
      animation: blobMorph var(--dur) var(--delay) ease-in-out infinite alternate;
    }

    .ambient-l1 {
      animation-duration: calc(var(--dur) * 1.2);
    }

    @keyframes blobMorph {
      0% { transform: translate3d(-50%, -50%, 0) scale(1) rotate(0deg); }
      100% { transform: translate3d(-50%, -50%, 0) scale(1.06) rotate(3deg); }
    }

    .ambient-grain {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.6) 0.5px, transparent 0.6px);
      background-size: 3px 3px;
    }
  </style>
</head>
<body>
  <div class="ambient-root" aria-hidden="true">
    <div class="ambient-parallax" id="parallax"></div>
    <div class="ambient-grain"></div>
  </div>
  <script>
    const BLOB_GEOMETRY = [
      { id: 'd1', layer: 1, size: 120, x: -20, y: -15, blur: 120, opacity: 0.35, dur: 82, delay: 0 },
      { id: 'd2', layer: 1, size: 110, x: 70,  y: 60,  blur: 130, opacity: 0.30, dur: 90, delay: -20 },
      { id: 'd3', layer: 1, size: 100, x: 40,  y: -30, blur: 140, opacity: 0.22, dur: 76, delay: -40 },
      { id: 'm1', layer: 2, size: 70,  x: 10,  y: 30,  blur: 80,  opacity: 0.40, dur: 54, delay: -10 },
      { id: 'm2', layer: 2, size: 65,  x: 75,  y: 10,  blur: 85,  opacity: 0.28, dur: 60, delay: -30 },
      { id: 'm3', layer: 2, size: 55,  x: 55,  y: 75,  blur: 90,  opacity: 0.20, dur: 48, delay: -15 },
      { id: 'g1', layer: 3, size: 50,  x: 30,  y: 50,  blur: 70,  opacity: 0.30, dur: 40, delay: -5 },
      { id: 'g2', layer: 3, size: 45,  x: 85,  y: 45,  blur: 75,  opacity: 0.26, dur: 44, delay: -25 },
    ];
    const PALETTE = ['#0fb389', '#4fe0d0', '#22c9d6', '#4aa8ff'];

    const root = document.getElementById('parallax');
    BLOB_GEOMETRY.forEach((b, i) => {
      const el = document.createElement('span');
      el.className = `ambient-blob ambient-l${b.layer}`;
      el.style.setProperty('--c', PALETTE[i % PALETTE.length]);
      el.style.setProperty('--sz', `${b.size}vmax`);
      el.style.setProperty('--x', `${b.x}%`);
      el.style.setProperty('--y', `${b.y}%`);
      el.style.setProperty('--bl', `${b.blur}px`);
      el.style.setProperty('--op', b.opacity);
      el.style.setProperty('--dur', `${b.dur}s`);
      el.style.setProperty('--delay', `${b.delay}s`);
      root.appendChild(el);
    });
  </script>
</body>
</html>
